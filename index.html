<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STACKRUSH - One-Tap Stacking Game</title>

<style>
:root{--bg1:#0b0d1a;--bg2:#1b1040;--fg:#fff;--mut:#a9a9c8;--card:rgba(10,10,25,.72);--acc:#ff3d81;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0b0d1a;--bg2:#1b1040}}
:root[data-theme="dark"]{--bg1:#0b0d1a;--bg2:#1b1040}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg1);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center;pointer-events:none}
#score{font-size:72px;font-weight:900;text-shadow:0 4px 24px rgba(255,61,129,.6)}
#combo{height:22px;font-weight:800;color:#ffd84d;letter-spacing:2px;font-size:15px}
#panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:26px 24px;text-align:center;max-width:340px;width:100%}
h1{margin:0;font-size:44px;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,#ff3d81,#ffd84d,#3df0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--mut);margin:8px 0 18px}
.big{font-size:56px;font-weight:900;margin:0}
button{font:inherit;font-weight:800;border:0;border-radius:16px;padding:15px 22px;margin:6px 4px 0;color:#fff;background:var(--acc);font-size:17px;width:100%}
button.alt{background:rgba(255,255,255,.14)}
#gear{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:46px;height:46px;border-radius:50%;padding:0;margin:0;font-size:22px;background:rgba(255,255,255,.16);z-index:5}
#sp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.6);z-index:6;overflow:auto}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.sk{background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:16px;padding:10px 6px;margin:0;font-size:14px;width:auto;color:var(--fg);font-weight:600}
.sk.on{border-color:#ffd84d}
.sk.lk{opacity:.55}
.sk small{color:var(--mut);font-weight:500}
#sp .card{margin:auto}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="score">0</div><div id="combo"></div></div>
<div id="panel"><div class="card" id="card"></div></div>
<button id="gear" aria-label="Settings">⚙️</button>
<div id="sp" class="hide"><div class="card" id="sc2"></div></div>
<script>
(function(){
var cv=document.getElementById('c'),cx=cv.getContext('2d');
var W,H,D;
function rs(){D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',rs);rs();
var BH=30,best=0,state='menu',blocks=[],cur,score=0,combo=0,cam=0,camT=0,debris=[],parts=[],rings=[],hue=Math.random()*360,shake=0,last=performance.now();
try{best=+localStorage.getItem('sr_best')||0}catch(e){}
var ac=null;
function beep(f,d,t){if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=t||'triangle';o.frequency.value=f;g.gain.value=.12;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
var daily=false,rng=Math.random,skin=0,mute=false,SK=[['Rainbow',0,'🌈'],['Gold',15,'🥇'],['Ice',30,'🧊'],['Candy',50,'🍬'],['Lava',75,'🌋'],['Galaxy',100,'🌌']];
try{mute=localStorage.getItem('sr_mute')=='1'}catch(e){}
function $(i){return document.getElementById(i)}
try{skin=+localStorage.getItem('sr_skin')||0}catch(e){}
function dstr(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function seed(){return parseInt(dstr().replace(/-/g,''),10)}
function gd(){try{return +localStorage.getItem('sr_d'+dstr())||0}catch(e){return 0}}
function mk(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function skinLbl(){if(best<SK[skin][1])skin=0;var n=SK.find(function(s){return s[1]>best});return '\u{1F3A8} SKIN: '+SK[skin][0]+(n?' (next at '+n[1]+')':'')}
var TH=[{n:'Sunset',e:'🌇',u:0,c:['#3a1c71','#ff7e5f']},{n:'Night City',e:'🌃',u:10,c:['#050816','#1d2b64']},{n:'Clouds',e:'☁️',u:20,c:['#2b6cb0','#a8d8ff']},{n:'Space',e:'🪐',u:35,c:['#02030a','#16123a']},{n:'Nebula',e:'🔮',u:55,c:['#12002b','#6a1b7a']}],theme=-1,thNow=0,thPrev=0,thFade=0,stars=[],clouds=[];
try{var tv=localStorage.getItem('sr_theme');theme=tv==null?-1:+tv}catch(e){}
for(var si=0;si<80;si++)stars.push({x:Math.random(),y:Math.random(),s:Math.random()*1.8+.6,p:Math.random()*6});
for(var ci=0;ci<7;ci++)clouds.push({x:Math.random(),y:Math.random()*.7,s:.6+Math.random()});
function stage(){if(theme>=0&&best>=TH[theme].u)return theme;if(theme>=0)theme=-1;var k=0;for(var i=0;i<TH.length;i++)if(score>=TH[i].u)k=i;return k}
thNow=stage();
function drawTh(k,a,t){
 var T=TH[k],g=cx.createLinearGradient(0,0,0,H),o=cam*.12,i,s;
 g.addColorStop(0,T.c[0]);g.addColorStop(1,T.c[1]);
 cx.globalAlpha=a;cx.fillStyle=g;cx.fillRect(0,0,W,H);
 if(k==1||k>=3){cx.fillStyle='#fff';for(i=0;i<stars.length;i++){s=stars[i];cx.globalAlpha=a*(.35+.65*Math.abs(Math.sin(t/700+s.p)));cx.fillRect(s.x*W,((s.y*H+o)%H),s.s,s.s)}}
 cx.globalAlpha=a;
 if(k==4){var r=cx.createRadialGradient(W*.3,H*.35+o,10,W*.3,H*.35+o,W*.6);r.addColorStop(0,'rgba(255,80,200,.35)');r.addColorStop(1,'rgba(255,80,200,0)');cx.fillStyle=r;cx.fillRect(0,0,W,H);var r2=cx.createRadialGradient(W*.8,H*.7+o,10,W*.8,H*.7+o,W*.5);r2.addColorStop(0,'rgba(80,160,255,.3)');r2.addColorStop(1,'rgba(80,160,255,0)');cx.fillStyle=r2;cx.fillRect(0,0,W,H)}
 if(k==0){cx.fillStyle='#ffd27a';cx.beginPath();cx.arc(W*.7,H*.55+o*2,70,0,6.3);cx.fill()}
 if(k==1){cx.fillStyle='#f4f1de';cx.beginPath();cx.arc(W*.25,H*.2+o,32,0,6.3);cx.fill()}
 if(k==3){cx.fillStyle='#c97b4a';cx.beginPath();cx.arc(W*.78,H*.25+o*1.5,48,0,6.3);cx.fill();cx.strokeStyle='rgba(255,220,180,.6)';cx.lineWidth=5;cx.beginPath();cx.ellipse(W*.78,H*.25+o*1.5,76,16,-.4,0,6.3);cx.stroke()}
 if(k==2){cx.fillStyle='rgba(255,255,255,.6)';for(i=0;i<clouds.length;i++){var c=clouds[i],px=((c.x*W+t*.02*c.s)%(W+240))-120,py=((c.y*H+o*2)%H);cx.beginPath();cx.ellipse(px,py,60*c.s,20*c.s,0,0,6.3);cx.fill();cx.beginPath();cx.ellipse(px+30*c.s,py-10*c.s,40*c.s,18*c.s,0,0,6.3);cx.fill()}}
 if(k<2){var base=H-70+cam*.35,x=0,j;cx.fillStyle=k?'#0a0f24':'#1a0b2e';for(i=0;x<W;i++){var bw=34+((i*53)%30),bh=40+((i*37)%90);cx.fillRect(x,base-bh,bw-2,bh+H);if(k==1){cx.fillStyle='rgba(255,220,120,.75)';for(j=0;j<bh-10;j+=14)if((i*7+j)%3==0)cx.fillRect(x+6,base-bh+8+j,5,6);cx.fillStyle='#0a0f24'}x+=bw}}
 cx.globalAlpha=1;
}
function openSet(){
 var h='<h1 style="font-size:30px">SETTINGS</h1><p>Best score: '+best+' · tap a block style to equip</p><div class="sg">';
 SK.forEach(function(s,k){
  var ok=best>=s[1],pv='';
  for(var j=3;j>=0;j--)pv+='<span style="display:block;height:9px;margin:2px auto;width:'+(46+j*6)+'px;background:'+col(j,null,k)+'"></span>';
  h+='<button class="sk'+(k==skin?' on':'')+(ok?'':' lk')+'" data-k="'+k+'">'+pv+'<b>'+s[2]+' '+s[0]+'</b><br><small>'+(ok?(k==skin?'Equipped':'Unlocked'):'🔒 Best '+s[1]+' to unlock')+'</small></button>';
 });
 h+='</div><p style="margin:14px 0 6px">BACKGROUND</p><div class="sg"><button class="sk th'+(theme<0?' on':'')+'" data-t="-1"><b>🔄 Auto</b><br><small>Changes as you climb</small></button>';
 TH.forEach(function(T,k){var ok=best>=T.u;h+='<button class="sk th'+(theme==k?' on':'')+(ok?'':' lk')+'" data-t="'+k+'"><span style="display:block;height:26px;border-radius:8px;margin-bottom:4px;background:linear-gradient('+T.c[0]+','+T.c[1]+')"></span><b>'+T.e+' '+T.n+'</b><br><small>'+(ok?(theme==k?'Equipped':'Unlocked'):'🔒 Best '+T.u+' to unlock')+'</small></button>'});
 h+='</div><button class="alt" id="snd">'+(mute?'🔇 SOUND: OFF':'🔊 SOUND: ON')+'</button><button id="cl">DONE</button>';
 $('sc2').innerHTML=h;$('sp').classList.remove('hide');
 var b=$('sc2').querySelectorAll('.sk:not(.th)');
 for(var q=0;q<b.length;q++)b[q].onclick=function(){var k=+this.getAttribute('data-k');if(best>=SK[k][1]){skin=k;try{localStorage.setItem('sr_skin',k)}catch(e){}openSet()}};
 var tb=$('sc2').querySelectorAll('.th');for(q=0;q<tb.length;q++)tb[q].onclick=function(){var k=+this.getAttribute('data-t');if(k<0||best>=TH[k].u){theme=k;try{localStorage.setItem('sr_theme',k)}catch(e){}thNow=stage();thFade=0;openSet()}};
 $('snd').onclick=function(){mute=!mute;try{localStorage.setItem('sr_mute',mute?'1':'0')}catch(e){}openSet()};
 $('cl').onclick=function(){$('sp').classList.add('hide');if(state==='menu')menu(false)};
}
function nextSkin(){var k=skin;do{k=(k+1)%SK.length}while(SK[k][1]>best);skin=k;try{localStorage.setItem('sr_skin',k)}catch(e){}}
function col(i,l,k){k=k==null?skin:k;var h,s=85,L=l||60;if(k==0)h=hue+i*9;else if(k==1){h=42+Math.sin(i*.5)*8;L=50+(i%2)*10}else if(k==2){h=190+Math.sin(i*.4)*20;s=70}else if(k==3){h=i%2?330:170}else if(k==4){h=4+(i%6)*7;L=42+(i%3)*8}else{h=250+Math.sin(i*.7)*55;s=90;L=45+(i%4)*5}return 'hsl('+(((h%360)+360)%360)+','+s+'%,'+L+'%)'}
function card9(btn){
 var t='I stacked '+score+' blocks in STACKRUSH \u{1F9F1}\u{1F525}'+(daily?' (Daily '+dstr()+')':'')+' Can you beat me? '+location.href;
 var c=document.createElement('canvas');c.width=1080;c.height=1350;var x=c.getContext('2d');
 var g=x.createLinearGradient(0,0,0,1350);g.addColorStop(0,'#2a1060');g.addColorStop(1,'#0b0d1a');x.fillStyle=g;x.fillRect(0,0,1080,1350);
 x.textAlign='center';x.fillStyle='#fff';x.font='900 90px system-ui,sans-serif';x.fillText('STACKRUSH',540,150);
 x.font='900 340px system-ui,sans-serif';x.fillText(String(score),540,520);
 x.font='700 48px system-ui,sans-serif';x.fillStyle='#a9a9c8';x.fillText(daily?'DAILY CHALLENGE '+dstr():'BLOCKS STACKED',540,600);
 var n=Math.min(blocks.length,15);
 for(var i=0;i<n;i++){var idx=blocks.length-1-i,b=blocks[idx],w=b.w*2.2,bx=540+(b.x+b.w/2-W/2)*2.2;x.fillStyle=col(idx);x.fillRect(bx-w/2,680+i*40,w,38)}
 x.fillStyle='#fff';x.font='800 56px system-ui,sans-serif';x.fillText('Can you beat me?',540,1320);
 c.toBlob(function(bl){
  try{var f=new File([bl],'stackrush.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],text:t}).catch(function(){});return}}catch(e){}
  share0(btn);
 });
}
var sc=document.getElementById('score'),cb=document.getElementById('combo'),panel=document.getElementById('panel'),card=document.getElementById('card');
function menu(over){
 panel.classList.remove('hide');$('gear').classList.remove('hide');
 if(!over){card.innerHTML='<h1>STACKRUSH</h1><p>Tap to drop. Line it up perfectly to keep your tower wide. How high can you go?</p><button id="go">TAP TO PLAY</button><button class="alt" id="daily">\u{1F4C5} DAILY CHALLENGE'+(gd()?' (best '+gd()+')':'')+'</button><button class="alt" id="skin">'+skinLbl()+'</button>'+(best?'<p style="margin-bottom:0">Best: '+best+'</p>':'')}
 else{card.innerHTML='<p style="margin:0">YOUR TOWER</p><div class="big">'+score+'</div><p>'+(score>=best&&score>0?'NEW BEST! \u{1F525}':'Best: '+best)+'</p><button id="share">SHARE &amp; CHALLENGE A FRIEND</button><button class="alt" id="go">PLAY AGAIN</button>'}
 document.getElementById('go').onclick=function(e){e.stopPropagation();start(daily)};
 var dl=document.getElementById('daily');if(dl)dl.onclick=function(e){e.stopPropagation();start(true)};
 var sk=document.getElementById('skin');if(sk)sk.onclick=function(e){e.stopPropagation();nextSkin();sk.textContent=skinLbl()};
 var s=document.getElementById('share');if(s)s.onclick=function(e){e.stopPropagation();share(s)};
}
function share(btn){try{card9(btn)}catch(e){share0(btn)}}
function share0(btn){
 var t='I stacked '+score+' blocks in STACKRUSH \u{1F9F1}\u{1F525} Can you beat me?';
 if(navigator.share){navigator.share({title:'STACKRUSH',text:t,url:location.href}).catch(function(){})}
 else{try{navigator.clipboard.writeText(t+' '+location.href);btn.textContent='COPIED! PASTE IT ANYWHERE'}catch(e){prompt('Copy and share:',t)}}
}
function start(d){daily=!!d;rng=daily?mk(seed()):Math.random;
 state='play';panel.classList.add('hide');$('gear').classList.add('hide');blocks=[];debris=[];parts=[];rings=[];score=0;combo=0;cam=0;camT=0;thNow=stage();thFade=0;hue=rng()*360;
 var bw=Math.min(300,W*.72);
 blocks.push({x:(W-bw)/2,w:bw});
 spawn();upd();
}
function spawn(){
 var t=blocks[blocks.length-1];
 cur={x:rng()<.5?-t.w:W,w:t.w,dir:0};
 cur.dir=cur.x<0?1:-1;
}
function upd(){sc.textContent=score;cb.textContent=combo>1?'PERFECT x'+combo:''}
function drop(){
 if(state!=='play')return;
 var t=blocks[blocks.length-1],ov=Math.min(cur.x+cur.w,t.x+t.w)-Math.max(cur.x,t.x);
 if(ov<=0){
  debris.push({x:cur.x,w:cur.w,y:blocks.length,vy:0,r:0});
  over();return;
 }
 if(Math.abs(cur.x-t.x)<7){
  cur.x=t.x;combo++;
  if(combo>=3){var nw=Math.min(t.w+8,Math.min(300,W*.72));cur.x-=(nw-cur.w)/2;cur.w=nw}
  rings.push({i:blocks.length,a:1,s:0});
  beep(520+combo*70,.18);vib(12);
  for(var k=0;k<14;k++)parts.push({x:cur.x+Math.random()*cur.w,i:blocks.length,vx:(Math.random()-.5)*5,vy:-Math.random()*5-1,l:1});
 }else{
  combo=0;
  var nx=Math.max(cur.x,t.x),nr=nx+ov;
  if(cur.x<t.x)debris.push({x:cur.x,w:t.x-cur.x,y:blocks.length,vy:0,r:-1});
  else debris.push({x:t.x+t.w,w:cur.x+cur.w-(t.x+t.w),y:blocks.length,vy:0,r:1});
  cur.x=nx;cur.w=ov;beep(240,.1);vib(6);
 }
 blocks.push({x:cur.x,w:cur.w});
 score++;camT=Math.max(0,(blocks.length-1)*BH-H*.38);
 spawn();upd();
}
function over(){
 state='over';shake=14;vib([40,40,80]);beep(120,.5,'sawtooth');
 if(score>best){best=score;try{localStorage.setItem('sr_best',best)}catch(e){}}
 if(daily&&score>gd()){try{localStorage.setItem('sr_d'+dstr(),score)}catch(e){}}
 setTimeout(function(){if(state==='over')menu(true)},750);
}
function by(i){return H-110-i*BH+cam}
function frame(n){
 var dt=Math.min((n-last)/16.67,3);last=n;
 if(state==='play'){
  var sp=2.4+Math.min(score*.07,5.5);
  cur.x+=cur.dir*sp*dt;
  if(cur.x<-cur.w*.6){cur.x=-cur.w*.6;cur.dir=1}
  if(cur.x>W-cur.w*.4){cur.x=W-cur.w*.4;cur.dir=-1}
 }
 cam+=(camT-cam)*.12*dt;
 debris.forEach(function(d){d.vy+=.7*dt;d.y-=0;d.fy=(d.fy||0)+d.vy*dt;d.x+=d.r*1.5*dt});
 debris=debris.filter(function(d){return d.fy<H});
 parts.forEach(function(p){p.x+=p.vx*dt;p.vy+=.25*dt;p.fy=(p.fy||0)+p.vy*dt;p.l-=.03*dt});
 parts=parts.filter(function(p){return p.l>0});
 rings.forEach(function(r){r.s+=4*dt;r.a-=.05*dt});
 rings=rings.filter(function(r){return r.a>0});
 // draw
var ts=stage();if(ts!==thNow){thPrev=thNow;thNow=ts;thFade=1}thFade=Math.max(0,thFade-.02*dt);if(thFade>0)drawTh(thPrev,1,n);drawTh(thNow,thFade>0?1-thFade:1,n);
 cx.save();
 if(shake>0){cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}
 for(var i=0;i<blocks.length;i++){
  var b=blocks[i],y=by(i);
  if(y>H+BH||y<-BH)continue;
  cx.fillStyle=col(i);cx.fillRect(b.x,y,b.w,BH-2);
  cx.fillStyle='rgba(255,255,255,.22)';cx.fillRect(b.x,y,b.w,5);
 }
 if(state==='play'){
  var y2=by(blocks.length);
  cx.fillStyle=col(blocks.length);cx.fillRect(cur.x,y2,cur.w,BH-2);
  cx.fillStyle='rgba(255,255,255,.3)';cx.fillRect(cur.x,y2,cur.w,5);
 }
 debris.forEach(function(d){cx.fillStyle=col(d.y);cx.globalAlpha=.85;cx.fillRect(d.x,by(d.y)+d.fy,d.w,BH-2);cx.globalAlpha=1});
 parts.forEach(function(p){cx.globalAlpha=p.l;cx.fillStyle='#fff';cx.fillRect(p.x,by(p.i)+p.fy,4,4);cx.globalAlpha=1});
 rings.forEach(function(r){var b=blocks[r.i];if(!b)return;cx.globalAlpha=Math.max(r.a,0);cx.strokeStyle='#ffd84d';cx.lineWidth=3;cx.strokeRect(b.x-r.s,by(r.i)-r.s,b.w+r.s*2,BH-2+r.s*2);cx.globalAlpha=1});
 cx.restore();
 requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown',function(e){e.preventDefault();if(state==='play')drop()});
addEventListener('keydown',function(e){if(e.code==='Space'){if(state==='play')drop();else if(!panel.classList.contains('hide'))start()}});
menu(false);$('gear').onclick=openSet;
requestAnimationFrame(frame);
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})</script>
</body>
</html>
